cases:
  - id: wepproad_1
    model: wepproad
    api:
      base_url: http://localhost:8090/api
      requests:
        - name: run
          method: POST
          path: /wepproad/RUN/wepp
          json:
            wepproad_pars:
              soil_texture: clay
              rfg_pct: 20
              road:
                slope_pct: 30
                length_m: 200
                width_m: 3
                surface: gravel
                design: inveg
                traffic: high
              fill:
                slope_pct: 15
                length_m: 10
              buffer:
                slope_pct: 10
                length_m: 100
            climate:
              par_id: WA459074
              input_years: 100
    legacy:
      working_dir: /workdir/fswepp-docker/var/www/cgi-bin/fswepp/working
      working_glob: wepp-*
